<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Retro Co-Op Club</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Обнуляем отступы и заставляем body занимать весь экран */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Запрещаем скролл */
            background-color: #000; /* Черный фон */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Принудительный альбомный режим (даже в портретном) */
        @media screen and (orientation: portrait) {
            body {
                transform: rotate(-90deg);
                transform-origin: left top;
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 100%;
                left: 0;
            }
        }

        /* Контейнер для эмулятора - на весь экран */
        #emulator_container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Кнопка "Меню" в углу (например, левом верхнем) */
        #menu_button {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999; /* Поверх всего */
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        #menu_button:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.4);
        }

    </style>
</head>
<body>

    <!-- Кнопка "Выход в меню" -->
    <button id="menu_button">🏠</button>

    <!-- Контейнер для эмулятора EmulatorJS -->
    <div id="emulator_container">
        <!-- Сюда скрипт эмулятора будет подставлять игру -->
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем WebApp на весь экран Telegram
        tg.enableClosingConfirmation(); // Подтверждение при закрытии

        // Функция закрытия WebApp (выход в меню бота)
        document.getElementById('menu_button').onclick = function() {
            tg.close();
        };

        // --- Конфигурация EmulatorJS ---
        EJS_player = "#emulator_container"; // Куда вставлять
        EJS_core = "nes"; // Платформа NES
        
        // Получаем параметры из URL (?rom=game.nes&room=123)
        const urlParams = new URLSearchParams(window.location.search);
        const romName = urlParams.get('rom');
        const roomId = urlParams.get('room'); // Для коопа

        if (romName) {
            EJS_gameUrl = romName; // Путь к ROM-файлу на GitHub Pages
            EJS_gameName = romName.replace('.nes', '').toUpperCase();
        }

        // Настройка мультиплеера, если есть roomID
        if (roomId) {
            EJS_netplayUrl = "wss://netplay.emulatorjs.org"; // Дефолтный сервер (PeerJS)
            EJS_netplayRoomId = roomId;
        }

        // Дополнительные настройки (по желанию, можно скрыть UI самого эмулятора)
        // EJS_color = "#333";
        // EJS_logo = false;
        // EJS_startOnKeyPress = true;

    </script>

    <!-- Подключаем основной скрипт EmulatorJS -->
    <script src="https://emulatorjs.org/cdn/nes.js"></script>

</body>
</html>
