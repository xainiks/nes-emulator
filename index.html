<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Co-Op Emulator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        #emulator-container { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

<div id="emulator-container">
    <div id="game"></div>
</div>

<script type="text/javascript">
    // Инициализация Telegram Web App
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.requestFullscreen) {
            window.Telegram.WebApp.requestFullscreen();
        }
    }

    // Читаем параметры из URL
    const urlParams = new URLSearchParams(window.location.search);
    let romUrl = urlParams.get('rom') || 'tanks.nes';
    const netplayRoom = urlParams.get('room');

    // Настройки EmulatorJS
    EJS_player = '#game';
    EJS_core = 'nes';
    EJS_gameUrl = encodeURI(romUrl);
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    // Закрытие Mini App при выходе из эмулятора
    EJS_onExit = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.close();
        }
    };

    // Настройки Netplay (мультиплеера)
    if (netplayRoom) {
        EJS_netplayUrl = 'wss://netplay.emulatorjs.org';
        EJS_room = netplayRoom;
    }

    // Обработка сворачивания/разворачивания приложения на смартфоне
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            if (window.EJS_emulator && window.EJS_emulator.pause) {
                window.EJS_emulator.pause();
            }
        } else {
            if (window.EJS_emulator && window.EJS_emulator.resume) {
                window.EJS_emulator.resume();
            }
        }
    });
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
