<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Co-Op Emulator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        #emulator-container { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

<div id="emulator-container">
    <div id="game"></div>
</div>

<script type="text/javascript">
    // Инициализация Telegram Web App
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.requestFullscreen) {
            window.Telegram.WebApp.requestFullscreen();
        }
    }

    // Список РОМов по ключам
    const GAMES_MAP = {
        'tanks': 'Battle City (J) [T+Rus1.2 PSCD (07.04.2017)].nes',
        'contra': 'Contra (U) [T-Rus uBAH009 (12.11.2016)].nes',
        'chip_dale': "Chip 'n Dale - Rescue Rangers 2 (U) [T+Rus She...nes"
    };

    // Читаем параметры из URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameKey = urlParams.get('game');
    let romUrl = urlParams.get('rom');

    // Определяем файл РОМа
    if (gameKey && GAMES_MAP[gameKey]) {
        romUrl = GAMES_MAP[gameKey];
    } else if (!romUrl) {
        romUrl = GAMES_MAP['tanks'];
    }

    const netplayRoom = urlParams.get('room');

    // Настройки EmulatorJS
    EJS_player = '#game';
    EJS_core = 'nes';
    EJS_gameUrl = encodeURI(romUrl);
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;

    // Автоматическое закрытие Mini App при нажатии на выход в эмуляторе
    EJS_onExit = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.close();
        }
    };

    // Настройки Netplay (мультиплеера)
    if (netplayRoom) {
        EJS_netplayUrl = 'wss://netplay.emulatorjs.org';
        EJS_room = netplayRoom;
    }
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
